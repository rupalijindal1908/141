<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my game website</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background-color: aliceblue;
            text-align: center;
            padding: 30px;
        }
        h1{
            color: navy;
        }
        button{
            background: navy;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        div{
            border: 1px solid navy;
            width: 280px;
            margin: 6px auto;
            text-align: left;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>my game profile</h1>
    <button onclick="showprofile()">show profile</button>
    <div>Name: <span id="name"></span></div>
    <div>score <span id="score"></span></div>
    <div>top score: <span id="record"></span></div>
    <div>Rank: <span id="rank"></span></div>
    <div>Greeting: <span id="greeting"></span></div>
    <div>stars: <span id="stars"></span></div>
    <div>bonus level: <span id="bonus"></span></div>
    <div>team name: <span id="team"></span></div>
    <script>
        function showprofile() {
            let name = "alex";
            let score = 75;
            let record = 100;
            let bonus = null;
            let team;
            let topscore = score == record;
            let rank;
            if(score >=80){
                rank = "gold";
            }
            else if (
                score >= 50
            ){
                rank = "silver";
            }
            else {
                rank = "bronze";
            }
            let hour = new Date().getHours();
            let greeting;
            if (hour < 12){greeting = "good morning";}
            else if (hour < 17) {greeting = "good after noon";}
            else{greeting = "good evening";}
            let stars = "";
            let count = 0;
            while(count < 5){
                stars = stars + "* ";  
                count = count + 1;
            }
            document.getElementById("name").innerHTML = name;
            document.getElementById("score").innerHTML = score + " out of " + record;
            document.getElementById("record").innerHTML = topscore;
            document.getElementById("rank").innerHTML = rank;
            document.getElementById("greeting").innerHTML = greeting;
            document.getElementById("stars").innerHTML = stars;
            document.getElementById("bonus").innerHTML = bonus;
            document.getElementById("team").innerHTML = team;
        }
    </script>
</body>
</html>
